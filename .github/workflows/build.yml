name: Build SCSS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Build SCSS
        run: npm run build
      - name: Upload built CSS
        uses: actions/upload-artifact@v4
        with:
          name: built-css
          path: dist/main.css
