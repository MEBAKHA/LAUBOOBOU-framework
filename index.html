<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lauboobou — Demo</title>
  <link rel="stylesheet" href="dist/main.css">
  <style>
    /* layout demo kecil */
    body{font-family:Arial,Helvetica,sans-serif;padding:24px}
    .row{display:flex;gap:12px;flex-wrap:wrap}
  </style>
</head>
<body>
  <h1>Demo Tombol Lauboobou</h1>
  <p>Contoh penggunaan kelas tombol dari framework. Gunakan kelas <code>btnsty</code> dan salah satu varian warna seperti <code>btnsty-bhan</code>, <code>btnsty-merite</code>, dsb.</p>

  <div class="row">
    <button class="btnsty btnsty-bhan">Primary (bhan)</button>
    <button class="btnsty btnsty-merite">Success (merite)</button>
    <button class="btnsty btnsty-mark">Pink (mark)</button>
    <button class="btnsty btnsty-zk">Light (zk)</button>
    <button class="btnsty btnsty-kr">Orange (kr)</button>
  </div>

  <hr>
  <p>Jika tombol tidak tampil sesuai, pastikan file <code>dist/main.css</code> tersedia dan path pada tag &lt;link&gt; benar.</p>
</body>
</html>
